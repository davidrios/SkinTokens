services:
  skintokens:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${SKINTOKENS_BASE_IMAGE:-torch-runtime:2.11.0-cu128-py3.11}
    image: skintokens:cu128-torch2.11.0
    container_name: skintokens
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: all
      SKINTOKENS_DEVICE: cuda
      SKINTOKENS_HOST: 0.0.0.0
      SKINTOKENS_PORT: 8000
      # Worker processes, each with its own model copy (~2-4 GB VRAM): up to this
      # many requests run in parallel on the GPU.
      SKINTOKENS_WORKERS: ${SKINTOKENS_WORKERS:-2}
      SKINTOKENS_MAX_NUM_SAMPLES: ${SKINTOKENS_MAX_NUM_SAMPLES:-1}
      SKINTOKENS_MAX_NEW_TOKENS: 2048
      SKINTOKENS_USE_CACHE: 1
      SKINTOKENS_EMPTY_CACHE_AFTER_INFERENCE: 1
      SKINTOKENS_FAST_DECODE: 1
      SKINTOKENS_FAST_DECODE_BACKEND: inductor
      # Input hardening limits for untrusted uploads (see src/rig_package/glb_io/limits.py)
      SKINTOKENS_MAX_UPLOAD_MB: ${SKINTOKENS_MAX_UPLOAD_MB:-16}
      SKINTOKENS_INPUT_MAX_VERTICES: ${SKINTOKENS_INPUT_MAX_VERTICES:-1000000}
      SKINTOKENS_INPUT_MAX_FACES: ${SKINTOKENS_INPUT_MAX_FACES:-1000000}
      SKINTOKENS_INPUT_MAX_MESH_INSTANCES: ${SKINTOKENS_INPUT_MAX_MESH_INSTANCES:-128}
      SKINTOKENS_INPUT_MAX_PRIMITIVES: ${SKINTOKENS_INPUT_MAX_PRIMITIVES:-256}
    working_dir: /workspace/SkinTokens
    ports:
      - "8087:8000"
    shm_size: 1gb
    command: ["python", "serve.py"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - ai-shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  ai-shared:
    external: true
