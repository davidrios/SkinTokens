services:
  skintokens:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${SKINTOKENS_BASE_IMAGE:-torch-runtime:2.11.0-cu128-py3.11}
    image: skintokens:cu128-torch2.11.0
    container_name: skintokens
    restart: unless-stopped
    # Allow the gateway to drain requests and close its worker pool (30s,
    # plus termination fallback) before Docker resorts to SIGKILL.
    stop_grace_period: 60s
    # All host GPUs: the worker pool pins its workers to the cards
    # round-robin (SKINTOKENS_WORKERS per GPU).
    gpus: all
    environment:
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      SKINTOKENS_DEVICE: cuda
      SKINTOKENS_HOST: 0.0.0.0
      SKINTOKENS_PORT: 8000
      # Worker processes per GPU, each with its own model copy (~2-4 GB VRAM);
      # the total is this count times the number of visible GPUs (workers are
      # pinned to the cards round-robin), and up to that many requests run in
      # parallel.
      SKINTOKENS_WORKERS: ${SKINTOKENS_WORKERS:-2}
      SKINTOKENS_MAX_NUM_SAMPLES: ${SKINTOKENS_MAX_NUM_SAMPLES:-1}
      SKINTOKENS_MAX_NEW_TOKENS: 2048
      # Results are rig payloads (skeleton + skin; clients add them to the file
      # they uploaded). Set to 1 to also serve "output": "glb" (whole GLBs).
      SKINTOKENS_ENABLE_GLB_OUTPUT: ${SKINTOKENS_ENABLE_GLB_OUTPUT:-0}
      # Requests allowed to wait for a worker beyond the ones running; each
      # holds its upload in the gateway, so this bounds gateway memory to
      # about (total workers + SKINTOKENS_MAX_QUEUE) * SKINTOKENS_MAX_UPLOAD_MB
      # (total workers = SKINTOKENS_WORKERS times the number of visible GPUs).
      SKINTOKENS_MAX_QUEUE: ${SKINTOKENS_MAX_QUEUE:-16}
      # Time a client has to send its header / its whole upload, in seconds.
      SKINTOKENS_HEADER_TIMEOUT_SEC: ${SKINTOKENS_HEADER_TIMEOUT_SEC:-30}
      SKINTOKENS_UPLOAD_TIMEOUT_SEC: ${SKINTOKENS_UPLOAD_TIMEOUT_SEC:-300}
      # Logs: one line per request at INFO (SKINTOKENS_LOG_LEVEL=DEBUG for stage
      # details), archived daily to <output root>/logs/skintokens-YYYY-MM-DD.log;
      # failed requests leave <output root>/dump/<date>/<request_id>/.
      # Copy out with: docker compose cp skintokens:/data/outputs/dump/<date>/<request_id> .
      SKINTOKENS_OUTPUT_ROOT: /data/outputs
      SKINTOKENS_LOG_LEVEL: ${SKINTOKENS_LOG_LEVEL:-INFO}
      SKINTOKENS_USE_CACHE: 1
      SKINTOKENS_EMPTY_CACHE_AFTER_INFERENCE: 1
      SKINTOKENS_FAST_DECODE: 1
      SKINTOKENS_FAST_DECODE_BACKEND: inductor
      # Input hardening limits for untrusted uploads (see src/rig_package/glb_io/limits.py)
      SKINTOKENS_MAX_UPLOAD_MB: ${SKINTOKENS_MAX_UPLOAD_MB:-32}
      SKINTOKENS_INPUT_MAX_NODES: ${SKINTOKENS_INPUT_MAX_NODES:-4096}
      SKINTOKENS_INPUT_MAX_VERTICES: ${SKINTOKENS_INPUT_MAX_VERTICES:-1000000}
      SKINTOKENS_INPUT_MAX_FACES: ${SKINTOKENS_INPUT_MAX_FACES:-1000000}
      SKINTOKENS_INPUT_MAX_MESH_INSTANCES: ${SKINTOKENS_INPUT_MAX_MESH_INSTANCES:-128}
      SKINTOKENS_INPUT_MAX_PRIMITIVES: ${SKINTOKENS_INPUT_MAX_PRIMITIVES:-256}
    volumes:
      - skintokens-outputs:/data/outputs
    working_dir: /workspace/SkinTokens
    ports:
      - "8087:8000"
    shm_size: 1gb
    command: ["python", "-m", "src.server.log_archive", "python", "serve.py"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - ai-shared

volumes:
  skintokens-outputs:

networks:
  ai-shared:
    external: true
